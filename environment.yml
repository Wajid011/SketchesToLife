name: sketch2image
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.10.14

  # PyTorch with CUDA 12.1 (GPU environments)
  - pytorch=2.1.2
  - torchvision=0.16.2
  - pytorch-cuda=12.1

  # System-level image libs
  - libpng
  - libjpeg-turbo

  # pip-managed packages (HF stack not on conda)
  - pip
  - pip:
    - diffusers==0.27.2
    - transformers==4.40.2
    - accelerate==0.30.1
    - huggingface-hub==0.23.0
    - safetensors==0.4.3
    - tokenizers==0.19.1
    - controlnet-aux==0.0.7
    - opencv-python==4.9.0.80
    - Pillow==10.3.0
    - numpy==1.26.4
    - scipy==1.13.0
    - scikit-image==0.23.2
    - matplotlib==3.8.4
    - pyyaml==6.0.1
    - click==8.1.7
    - gradio==4.31.5
    - tqdm==4.66.4
    - lpips==0.1.4
    - torchmetrics==1.3.2
    - pytest==8.2.0
    - pytest-cov==5.0.0
    - ruff==0.4.4
    - -e .
