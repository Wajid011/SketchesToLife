[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sketch2image"
version = "0.1.0"
description = "Bringing Sketches to Life with Generative AI — MSc project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Wajid" }]
keywords = ["stable-diffusion", "controlnet", "sketch-to-image", "generative-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime deps kept minimal; heavy GPU deps installed separately
dependencies = [
    "pyyaml>=6.0.1",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "click>=8.1.7",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1.0",
    "diffusers>=0.27.0",
    "transformers>=4.38.0",
    "accelerate>=0.28.0",
    "controlnet-aux>=0.0.7",
    "opencv-python>=4.9.0",
    "gradio>=4.19.0",
    "scipy>=1.12.0",
    "scikit-image>=0.23.0",
    "lpips>=0.1.4",
    "torchmetrics>=1.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
# CLI entry points (wired up when implementation is written)
s2i-generate  = "sketch2image.generate:main"
s2i-check-env = "sketch2image.utils:check_env_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# ---------------------------------------------------------------------------
# Ruff — linter / formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ANN", # flake8-annotations (type hints)
    "D",   # pydocstyle
]
ignore = [
    "D100", # Missing docstring in public module (top-level init files)
    "D104", # Missing docstring in public package
    "ANN101", # Missing type annotation for `self`
    "ANN102", # Missing type annotation for `cls`
    "ANN401", # Any is used for lazily imported third-party objects (pipelines, detectors)
    "D107",   # __init__ args are documented in the class docstring (Google style)
    "UP038",  # isinstance(x, A | B) is slower than a tuple; rule deprecated upstream
]

[tool.ruff.lint.per-file-ignores]
# Tests are not public API: no docstring / annotation requirements.
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.flake8-annotations]
# **kwargs are forwarded to diffusers / Gradio, where Any is the honest type.
allow-star-arg-any = true

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 88; E501 only flags long strings/comments it can't wrap.
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["sketch2image"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "gpu: marks tests that require a CUDA GPU (deselect with -m 'not gpu')",
    "slow: marks tests that are slow to run",
    "integration: marks integration tests",
]

# ---------------------------------------------------------------------------
# Mypy (optional static type checking)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
